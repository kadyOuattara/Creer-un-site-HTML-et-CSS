 <section class="premier-partie">
<header>

<body>
    <div class="text">
    <h1>Robbie Lens <br>Photographie</h1>
    <p>ou <em>professionalisme</em> s'aille avec <em>passion</em> .Depuis plus de 5 ans 
        <br>maintenant, j'exerce mon métier avec la passion qui m'aime: 
        <br>capturer l'essence de chaque instant
    </p>
    </div>
    <img src="robbie-lens.png" alt="">
    </section>
    <section class="photo">
       <div class="container my-5">
  <!-- Titre de la section (centré) -->
  <h2 class="text-center mb-4">Mon dernier projet</h2>

  <!-- Grille d'images -->
  <div class="row g-4"> <!-- g-4 gère l'espacement (les gouttières) entre les images -->
    
    <!-- Image 1 -->
    <div class="col-md-4">
      <img src="photo1.jpg" class="img-fluid rounded" alt="Projet 1">
    </div>

    <!-- Image 2 -->
    <div class="col-md-4">
      <img src="photo2.jpg" class="img-fluid rounded" alt="Projet 2">
    </div>

    <!-- Image 3 -->
    <div class="col-md-4">
      <img src="photo3.jpg" class="img-fluid rounded" alt="Projet 3">
    </div>

    <!-- Si vous avez d'autres images pour la ligne suivante, elles se placeront automatiquement en dessous -->
    <div class="col-md-4">
      <img src="photo4.jpg" class="img-fluid rounded" alt="Projet 4">
    </div>
    <div class="col-md-4">
      <img src="photo5.jpg" class="img-fluid rounded" alt="Projet 5">
    </div>
    <div class="col-md-4">
      <img src="photo6.jpg" class="img-fluid rounded" alt="Projet 6">
    </div>

  </div>
</div>
    </section>
    <section class="contact">
        <h2>Parlons de votre projet</h2>
        <form class="contact-form">
            <div class="contact-form-row">
                <div class="contact-form-field">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" autocomplete="name" required>
                </div>
                <div class="contact-form-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
            </div>

            <div class="contact-form-field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
             <div class="bouton">
            <button type="submit">Envoyer</button>
            </div>
        </form>
        <footer>
